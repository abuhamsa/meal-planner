# Serves the built frontend and forwards /api to the backend container.
# TLS and authentication are handled in front of this by SWAG + Authentik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        # Request headers are passed through unchanged, including the X-authentik-*
        # headers SWAG adds after Authentik has approved the session.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
