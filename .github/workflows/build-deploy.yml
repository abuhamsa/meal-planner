# Tests the app, then builds and deploys both images via the reusable workflow
# https://github.com/abuhamsa/workflows (build-deploy).
#
# - Pull requests: tests + image builds, nothing is pushed.
# - Push to main:  next patch release (v2.2.0 -> v2.2.1). Images ghcr.io/abuhamsa/meal-planner-*
#                  get 2.2.1, 2.2, 2 and sha-<commit>; the commit gets the git tag v2.2.1.
# - Tag vX.Y.Z:    for minor/major bumps (git tag v2.3.0 && git push origin v2.3.0).
#
# The version (e.g. 2.2.1) is shown in the footer of the People page (backend APP_VERSION).
name: Test, build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Runs of one ref must not overlap, or two of them would compute the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # release tags
  packages: write # push to ghcr.io

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      # Type check + production build.
      - run: npm run build

  build-deploy:
    needs: [backend-tests, frontend-checks]
    uses: abuhamsa/workflows/.github/workflows/build-deploy.yml@main
    with:
      images: |
        meal-planner-backend  ./backend
        meal-planner-frontend ./frontend
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
