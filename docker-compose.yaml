# Meal Planner v2
#
# Nothing here publishes a port. SWAG reaches the frontend container over its Docker
# network, checks the Authentik session, and only then forwards the request. The backend
# is only on the internal network, so it can't be reached around the proxy.
services:
  backend:
    build: ./backend
    image: abuhamsa/meal-planner-backend:2
    restart: unless-stopped
    environment:
      AUTH_MODE: proxy
    volumes:
      - ./data:/app/data
    networks:
      - internal

  frontend:
    build: ./frontend
    image: abuhamsa/meal-planner-frontend:2
    # SWAG's proxy conf uses this name as upstream.
    container_name: meal-planner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - swag

networks:
  internal:
  swag:
    # The existing Docker network your SWAG container is attached to.
    external: true
    name: ${SWAG_NETWORK:-swag}
